<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solarion Retro Arcade</title>
    <style>
        body { background: #151515; color: #fff; font-family: system-ui, sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #ffcc00; text-shadow: 2px 2px #000; }
        .menu-container { margin: 20px auto; }
        select { padding: 12px 20px; font-size: 16px; background: #333; color: #fff; border: 2px solid #ffcc00; border-radius: 5px; cursor: pointer; }
        #game-container { width: 640px; height: 480px; max-width: 100%; margin: 20px auto; background: #000; border: 4px solid #333; }
        #emulator { width: 100%; height: 100%; }
        .vault-section { max-width: 500px; margin: 40px auto; padding: 20px; background: #1c1c1c; border: 1px dashed #444; border-radius: 8px; text-align: left; }
    </style>
</head>
<body>
    <h1>🎮 Solarion Arcade 🕹️</h1>
    <p>Play online or download setups for local offline use.</p>

    <div class="menu-container">
        <select id="game-selector" onchange="loadSelectedGame()">
            <option value="" disabled selected>--- Choose a Game to Play Online ---</option>
            <option value="roms/super_mario_land.gb" data-core="gb">Super Mario Land (GB)</option>
            <option value="roms/pokemon_emerald.gba" data-core="gba">Pokémon Emerald (GBA)</option>
            <option value="roms/star_fox_64.z64" data-core="n64">Star Fox 64 (N64)</option>
            <option value="roms/pokemon_black.nds" data-core="nds">Pokémon Black (NDS)</option>
        </select>
    </div>

    <div id="game-container"><div id="emulator"></div></div>

    <div class="vault-section">
        <h3>💾 Solarion's Offline Vault</h3>
        <ul>
            <li><a href="vault/super_mario_land.html" target="_blank" download>Super Mario Land (GB)</a></li>
            <li><a href="vault/pokemon_emerald.html" target="_blank" download>Pokémon Emerald (GBA)</a></li>
        </ul>
    </div>

    <script>
        function loadSelectedGame() {
            const selector = document.getElementById('game-selector');
            const opt = selector.options[selector.selectedIndex];
            if (!opt.value) return;
            document.getElementById('game-container').innerHTML = '<div id="emulator"></div>';
            EJS_player = '#emulator'; EJS_gameUrl = opt.value; EJS_core = opt.getAttribute('data-core');
            EJS_pathtodata = 'https://jsdelivr.net';
            const loader = document.createElement('script');
            loader.src = 'https://jsdelivr.netloader.js';
            document.body.appendChild(loader);
        }
    </script>
</body>
</html>
