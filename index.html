<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solarion Retro Arcade</title>
    <style>
        body { background: #151515; color: #fff; font-family: system-ui, sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1 { margin-bottom: 5px; color: #ffcc00; text-shadow: 2px 2px #000; }
        .menu-container { margin: 20px auto; }
        select { padding: 10px 20px; font-size: 16px; background: #333; color: #fff; border: 2px solid #ffcc00; border-radius: 5px; cursor: pointer; }
        #game-container { width: 640px; height: 480px; max-width: 100%; margin: 20px auto; background: #000; border: 4px solid #333; box-shadow: 0px 10px 20px rgba(0,0,0,0.5); }
        #emulator { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <h1>🎮 Solarion Arcade 🕹️</h1>
    <p>Select a game to boot the emulator directly in your browser.</p>

    <div class="menu-container">
        <!-- Game Dropdown Selection Menu -->
        <select id="game-selector" onchange="loadSelectedGame()">
            <option value="" disabled selected>--- Choose a Game ---</option>
            <!-- Game Boy -->
            <option value="roms/super_mario_land.gb" data-core="gb">Super Mario Land (GB)</option>
            <!-- Game Boy Advance -->
            <option value="roms/pokemon_emerald.gba" data-core="gba">Pokémon Emerald (GBA)</option>
            <option value="roms/super_mario_advance1.gba" data-core="gba">Super Mario Advance 1 (GBA)</option>
            <!-- Nintendo 64 -->
            <option value="roms/star_fox_64.z64" data-core="n64">Star Fox 64 (N64)</option>
            <option value="roms/super_smash_bros_64.z64" data-core="n64">Super Smash Bros 64 (N64)</option>
            <!-- Nintendo DS -->
            <option value="roms/pokemon_black.nds" data-core="nds">Pokémon Black (NDS)</option>
            <option value="roms/kirby_super_star_ultra.nds" data-core="nds">Kirby Super Star Ultra (NDS)</option>
            <option value="roms/new_super_mario_bros.nds" data-core="nds">New Super Mario Bros. (NDS)</option>
        </select>
    </div>

    <div id="game-container">
        <div id="emulator"></div>
    </div>

    <script>
        function loadSelectedGame() {
            const selector = document.getElementById('game-selector');
            const selectedOption = selector.options[selector.selectedIndex];
            
            const fileUrl = selectedOption.value;
            const coreType = selectedOption.getAttribute('data-core');

            if (!fileUrl) return;

            // Clear previous emulator instance safely
            document.getElementById('game-container').innerHTML = '<div id="emulator"></div>';

            // Configure EmulatorJS parameters dynamically
            EJS_player = '#emulator';
            EJS_gameUrl = fileUrl;
            EJS_core = coreType;
            EJS_pathtodata = 'https://jsdelivr.net';
            
            // Inject loader script to boot the fresh core
            const loader = document.createElement('script');
            loader.src = 'https://jsdelivr.netloader.js';
            document.body.appendChild(loader);
        }
    </script>

</body>
</html>
