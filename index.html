<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solarion Arcade — Gaming Beyond Borders</title>
    <style>
        /* Modern Dark Theme Setup */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #050505; 
            color: #ffffff; 
            text-align: center; 
            padding: 40px 20px;
            margin: 0;
        }

        /* Branding Container */
        .brand-container {
            max-width: 450px;
            margin: 0 auto 30px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Centered Solarion Logo Design */
        .logo-img {
            max-width: 320px; 
            width: 100%; 
            height: auto; 
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.15); 
            margin-bottom: 5px;
        }

        /* Clean Game Console Grid Wrapper */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
            gap: 20px; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 10px;
        }

        /* High-Quality Game Interactive Button Cards */
        .game-card { 
            background: #111111; 
            padding: 25px 15px; 
            border-radius: 10px; 
            text-decoration: none; 
            color: #ffffff; 
            font-weight: 600; 
            font-size: 1.1rem;
            border: 2px solid #222222; 
            transition: all 0.25s ease-in-out; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Interactive Hover Animations */
        .game-card:hover { 
            background: #161616; 
            border-color: #ff9d00; 
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(255, 157, 0, 0.2);
        }

        /* Tiny Platform Badges Inside the Buttons */
        .badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
            color: #888888;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <!-- Solarion Branding Block -->
    <div class="brand-container">
        <img class="logo-img" src="logo.png" alt="Solarion - Gaming Beyond Borders">
    </div>

    <!-- The 8-Game Station Grid -->
    <div class="grid">
        <!-- Originals -->
        <a class="game-card" href="play.html?game=emerald&core=gba">
            Pokémon Emerald
            <span class="badge">Game Boy Advance</span>
        </a>
        <a class="game-card" href="play.html?game=black&core=nds">
            Pokémon Black
            <span class="badge">Nintendo DS</span>
        </a>
        <a class="game-card" href="play.html?game=kirby&core=nds">
            Kirby Super Star Ultra
            <span class="badge">Nintendo DS</span>
        </a>
        <a class="game-card" href="play.html?game=starfox64&core=n64">
            Star Fox 64
            <span class="badge">Nintendo 64</span>
        </a>
        <a class="game-card" href="play.html?game=smash64&core=n64">
            Super Smash Bros 64
            <span class="badge">Nintendo 64</span>
        </a>
        
        <!-- Mario Editions -->
        <a class="game-card" href="play.html?game=nsmb&core=nds">
            New Super Mario Bros.
            <span class="badge">Nintendo DS</span>
        </a>
        <a class="game-card" href="play.html?game=marioadvance1&core=gba">
            Super Mario Advance 1
            <span class="badge">Game Boy Advance</span>
        </a>
        <a class="game-card" href="play.html?game=marioland&core=gb">
            Super Mario Land
            <span class="badge">Game Boy Game</span>
        </a>
    </div>

</body>
</html>
