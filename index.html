<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solarion Arcade Cloud Vault</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#121212;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

.site-logo{
    width:150px;
    max-width:90%;
    border-radius:12px;
    margin-bottom:10px;
}

h1{
    color:#ffcc00;
}

.sub{
    color:#aaa;
    margin-bottom:25px;
}

.grid-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    max-width:900px;
    margin:auto;
}

.game-card{
    background:#1c1c1c;
    border:2px solid #333;
    border-radius:10px;
    padding:15px;
}

.game-card:hover{
    border-color:#00ffcc;
}

.play-btn{
    width:100%;
    padding:12px;
    background:#00ffcc;
    color:black;
    border:none;
    border-radius:5px;
    font-weight:bold;
    cursor:pointer;
}

.play-btn:hover{
    background:#00cc99;
}
</style>
</head>
<body>

<img src="Designer.png" alt="Solarion Logo" class="site-logo">

<h1>Solarion Arcade Cloud Vault</h1>

<p class="sub">
Launch a game instantly from the vault.
</p>

<div class="grid-container">

    <div class="game-card">
        <h3>Pokémon Emerald</h3>
        <button class="play-btn"
            onclick="streamGameRom('https://gba.nicholas-vancise.dev/)">
            Launch Game
        </button>
    </div>

    <div class="game-card">
        <h3>Super Smash Bros. 64</h3>
        <button class="play-btn"
            onclick="streamGameRom('vault/ssb.z64')">
            Launch Game
        </button>
    </div>

    <div class="game-card">
        <h3>Mario Kart 64</h3>
        <button class="play-btn"
            onclick="streamGameRom('vault/mk64.z64')">
            Launch Game
        </button>
    </div>

    <div class="game-card">
        <h3>Star Fox 64</h3>
        <button class="play-btn"
            onclick="streamGameRom('vault/sf64.z64')">
            Launch Game
        </button>
    </div>

    <div class="game-card">
        <h3>F-Zero X</h3>
        <button class="play-btn"
            onclick="streamGameRom('vault/f0x.z64')">
            Launch Game
        </button>
    </div>

    <div class="game-card">
        <h3>Mario Party 3</h3>
        <button class="play-btn"
            onclick="streamGameRom('vault/mp3.z64')">
            Launch Game
        </button>
    </div>
<div class="game-card">
    <h3>Solarion Defense</h3>
    <button class="play-btn"
        onclick="window.open('sd.html','_blank')">
        Launch Game
    </button>
</div>
</div>

<script>
function streamGameRom(romRelativePath){

    const romUrl =
        new URL(romRelativePath, window.location.href).href;

    window.open(
        "play.html?rom=" + encodeURIComponent(romUrl),
        "_blank"
    );
}
</script>

</body>
</html>
