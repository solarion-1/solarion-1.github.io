<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solarion Offline Arcade</title>
    <style>
        body { background: #121212; color: #fff; font-family: system-ui, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .brand-header { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 20px; }
        .site-logo { max-width: 150px; height: auto; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #ffcc00; text-shadow: 2px 2px #000; margin: 0; }
        .sub { color: #aaa; font-size: 13px; margin-bottom: 25px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; max-width: 900px; margin: 0 auto; }
        .game-card { background: #1c1c1c; border: 2px solid #333; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; transition: 0.2s; }
        .game-card:hover { border-color: #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.1); }
        .game-title { font-weight: bold; margin-bottom: 10px; color: #fff; }
        .play-btn { width: 100%; padding: 12px; background: #00ffcc; color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .play-btn:hover { background: #00cc99; }
        .loading-text { font-size: 12px; color: #ffcc00; margin-top: 5px; display: none; }
    </style>
</head>
<body>

    <div class="brand-header">
        <img src="Designer.png" alt="Solarion Logo" class="site-logo" onerror="this.style.display='none'">
        <h1>Solarion Arcade Cloud Vault</h1>
    </div>
    <p class="sub">Select a game to open it in a new tab with full hardware feature capabilities.</p>
    
    <div class="grid-container">
        <div class="game-card">
            <div class="game-title">Pokémon Emerald (GBA)</div>
            <button class="play-btn" onclick="launchLocalTab('vault/pokemon_emerald.html', this)">Launch Game</button>
            <div class="loading-text">Loading engine...</div>
        </div>
        <div class="game-card">
            <div class="game-title">Super Mario Advance 1 (GBA)</div>
            <button class="play-btn" onclick="launchLocalTab('vault/super_mario_advance.html', this)">Launch Game</button>
            <div class="loading-text">Loading engine...</div>
        </div>
        <div class="game-card">
            <div class="game-title">Super Smash Bros 64 (N64)</div>
            <button class="play-btn" onclick="launchLocalTab('vault/super_smash_bros_64.html', this)">Launch Game</button>
            <div class="loading-text">Loading engine...</div>
        </div>
        <div class="game-card">
            <div class="game-title">Kirby Super Star Ultra (NDS)</div>
            <button class="play-btn" onclick="streamLargeReleaseFile('https://github.com', this)">Launch Game</button>
            <div class="loading-text">Streaming heavy cloud file...</div>
        </div>
    </div>

    <script>
        // Standard launcher for normal GBA/N64 local files
        function launchGameTab(url) {
            const gameTab = window.open(url, '_blank');
            if (gameTab) gameTab.focus();
        }

        // Bypasses the download header on GitHub Release files entirely in your browser memory
        async function streamLargeReleaseFile(releaseUrl, buttonEl) {
            const loadText = buttonEl.nextElementSibling;
            buttonEl.disabled = true;
            buttonEl.style.background = "#555";
            loadText.style.display = "block";

            try {
                // Fetch the code text out of the file in the background
                const response = await fetch(releaseUrl);
                if (!response.ok) throw new Error("File unavailable");
                
                const textCode = await response.text();
                
                // Convert the raw text data directly into an active browser runnable memory block
                const localBlob = new Blob([textCode], { type: 'text/html' });
                const runtimeBlobUrl = URL.createObjectURL(localBlob);

                // Launch into the tab immediately
                const gameTab = window.open(runtimeBlobUrl, '_blank');
                if (!gameTab) {
                    alert("Popup blocked! Check your URL settings bar.");
                } else {
                    gameTab.focus();
                }
            } catch (err) {
                alert("Could not load release file asset stream.");
                console.error(err);
            } finally {
                buttonEl.disabled = false;
                buttonEl.style.background = "#00ffcc";
                loadText.style.display = "none";
            }
        }
    </script>
</body>
</html>
