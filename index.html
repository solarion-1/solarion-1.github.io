<script>
function streamGameRom(romRelativePath) {

    const romUrl = new URL(
        romRelativePath,
        window.location.href
    ).href;

    const emulatorPage = `
<!DOCTYPE html>
<html>
<head>
    <title>Pokémon Emerald</title>
    <style>
        body{
            margin:0;
            background:black;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        EJS_player = "#game";
        EJS_core = "gba";
        EJS_gameUrl = "${romUrl}";
        EJS_pathtodata = "${window.location.origin}/data/";
    <\/script>

    <script src="${window.location.origin}/data/loader.js"><\/script>
</body>
</html>`;

    const gameTab = window.open("", "_blank");

    if (!gameTab) {
        alert("Please allow popups.");
        return;
    }

    gameTab.document.write(emulatorPage);
    gameTab.document.close();
}
</script>
