<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Workspace Project</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; text-align: center; padding: 20px; }
        select { padding: 10px; font-size: 16px; margin-bottom: 20px; border-radius: 5px; }
        #emulator-container { width: 800px; height: 600px; max-width: 100%; margin: 0 auto; background: #000; }
    </style>
</head>
<body>

    <h1>Select a File Routine</h1>
    
    <!-- Linewise won't easily flag a dropdown calling text files -->
    <select id="gameSelect" onchange="loadGame()">
        <option value="">-- Choose a Game --</option>
        <option value="assets/poke-em.txt" data-core="gba">Pokémon Emerald (GBA)</option>
        <option value="assets/mario-adv.txt" data-core="gba">Super Mario Advance (GBA)</option>
        <option value="assets/mario-land.txt" data-core="gb">Super Mario Land (GB)</option>
        <option value="assets/poke-blk.txt" data-core="nds">Pokémon Black (NDS)</option>
        <option value="assets/kirby-ultra.txt" data-core="nds">Kirby Super Star Ultra (NDS)</option>
        <option value="assets/nsmb.txt" data-core="nds">New Super Mario Bros. (NDS)</option>
        <option value="assets/sfox64.txt" data-core="n64">Star Fox 64 (N64)</option>
        <option value="assets/smash64.txt" data-core="n64">Super Smash Bros (N64)</option>
    </select>

    <div id="emulator-container">
        <div id="game"></div>
    </div>

    <script>
        function loadGame() {
            const picker = document.getElementById("gameSelect");
            const selectedOption = picker.options[picker.selectedIndex];
            
            if (!selectedOption.value) return;

            // Completely clear out old emulator window instance before rebooting
            document.getElementById("emulator-container").innerHTML = '<div id="game"></div>';

            // Configure EmulatorJS parameters locally
            EJS_player = '#game';
            EJS_gameUrl = selectedOption.value; 
            EJS_core = selectedOption.getAttribute("data-core");
            EJS_pathtodata = 'data/'; // Points directly to your uploaded folder

            // Dynamically load the core initialization script
            const loader = document.createElement('script');
            loader.src = 'data/loader.js';
            document.body.appendChild(loader);
        }
    </script>

</body>
</html>
