<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solarion Arcade</title>

<style>
body{
    background:#121212;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    padding:20px;
}

.site-logo{
    max-width:150px;
    border-radius:12px;
}

.game-card{
    background:#1c1c1c;
    border:2px solid #333;
    border-radius:10px;
    padding:20px;
    max-width:300px;
    margin:auto;
}

.play-btn{
    width:100%;
    padding:12px;
    background:#00ffcc;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>
<body>

<img src="Designer.png" class="site-logo">

<h1>Solarion Arcade Cloud Vault</h1>

<div class="game-card">
    <h3>Pokémon Emerald (GBA)</h3>

    <button class="play-btn"
        onclick="streamGameRom('vault/emerald.gba')">
        Launch Game
    </button>
</div>

<script>
function streamGameRom(romRelativePath) {

    const romUrl =
        new URL(romRelativePath, window.location.href).href;

    window.open(
        "play.html?rom=" + encodeURIComponent(romUrl),
        "_blank"
    );
}
</script>

</body>
</html>
