<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solarion Offline Arcade</title>
    <style>
        body { background: #121212; color: #fff; font-family: system-ui, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .brand-header { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 20px; }
        .site-logo { max-width: 150px; height: auto; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #ffcc00; text-shadow: 2px 2px #000; margin: 0; }
        .sub { color: #aaa; font-size: 13px; margin-bottom: 25px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; max-width: 400px; margin: 0 auto; }
        .game-card { background: #1c1c1c; border: 2px solid #333; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; transition: 0.2s; }
        .game-card:hover { border-color: #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.1); }
        .game-title { font-weight: bold; margin-bottom: 10px; color: #fff; }
        .play-btn { width: 100%; padding: 12px; background: #00ffcc; color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .play-btn:hover { background: #00cc99; }
    </style>
</head>
<body>

    <div class="brand-header">
        <img src="Designer.png" alt="Solarion Logo" class="site-logo" onerror="this.style.display='none'">
        <h1>Solarion Arcade Cloud Vault</h1>
    </div>
    <p class="sub">Select a game to open it inside an unblocked emulator player window.</p>
    
    <div class="grid-container">
        <div class="game-card">
            <div class="game-title">Pokémon Emerald (GBA)</div>
            <!-- Updated relative path mapping to look for emerald.gba -->
            <button class="play-btn" onclick="streamGameRom('vault/emerald.gba', 'gba')">Launch Game</button>
        </div>
    </div>

    <script>
        function streamGameRom(romRelativePath, systemCoreString) {
            // Calculates the exact public web URL of your raw game file on GitHub Pages
            const absoluteRomUrl = `${window.location.origin}${window.location.pathname.split('/').slice(0, -1).join('/')}/${romRelativePath}`;
            
            // Forwards your local repository file path straight into the public unblocked EmulatorJS sandbox
            const networkEngineUrl = `https://emulatorjs.org{systemCoreString}&url=${encodeURIComponent(absoluteRomUrl)}`;
            
            const gameTab = window.open('', '_blank');
            if (!gameTab) {
                alert("Pop-up blocked! Please click the icon in your address bar and allow popups.");
                return;
            }
            gameTab.location.href = networkEngineUrl;
        }
    </script>
</body>
</html>
