<!DOCTYPE html>
<html>
<head>
    <title>Chromebook Arcade</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; text-align: center; padding-top: 50px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 600px; margin: 40px auto; }
        a { background: #222; padding: 20px; border-radius: 8px; text-decoration: none; color: #fff; font-weight: bold; border: 2px solid #333; display: block; }
        a:hover { background: #333; border-color: #0070f3; }
    </style>
</head>
<body>
    <h1>🎮 Chromebook Arcade</h1>
    <div class="grid">
        <a href="play.html?game=emerald&core=gba">Pokémon Emerald</a>
        <a href="play.html?game=black&core=nds">Pokémon Black</a>
        <a href="play.html?game=kirby&core=nds">Kirby Super Star Ultra</a>
        <a href="play.html?game=starfox64&core=n64">Star Fox 64</a>
        <a href="play.html?game=smash64&core=n64">Super Smash Bros 64</a>
    </div>
</body>
</html>
