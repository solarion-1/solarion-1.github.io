<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solarion Offline Arcade</title>
    <style>
        body { background: #121212; color: #fff; font-family: system-ui, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .brand-header { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 20px; }
        .site-logo { max-width: 150px; height: auto; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #ffcc00; text-shadow: 2px 2px #000; margin: 0; }
        .sub { color: #aaa; font-size: 13px; margin-bottom: 25px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; max-width: 900px; margin: 0 auto; }
        .game-card { background: #1c1c1c; border: 2px solid #333; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; transition: 0.2s; }
        .game-card:hover { border-color: #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.1); }
        .game-title { font-weight: bold; margin-bottom: 10px; color: #fff; }
        .play-btn { width: 100%; padding: 10px; background: #00ffcc; color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .play-btn:hover { background: #00cc99; }
    </style>
</head>
<body>
    <div class="brand-header">
        <h1>Solarion Arcade Cloud Vault</h1>
    </div>
    <p class="sub">Select a game to launch it in a stealth tab.</p>
    <div class="grid-container">
        <div class="game-card">
            <div class="game-title">Pokémon Emerald (GBA)</div>
            <button class="play-btn" onclick="launchStealthGame('vault/pokemon_emerald.html')">Launch Game</button>
        </div>
        <div class="game-card">
            <div class="game-title">Super Mario Advance 1 (GBA)</div>
            <!-- Updated path below to match your exact file name without the 1 -->
            <button class="play-btn" onclick="launchStealthGame('vault/super_mario_advance.html')">Launch Game</button>
        </div>
    </div>
    <script>
        function launchStealthGame(targetGameUrl) {
            const stealthTab = window.open('about:blank', '_blank');
            if (!stealthTab) return;
            
            // Clean dynamic base path resolver to prevent broken paths inside about:blank
            const pathSegments = window.location.pathname.split('/');
            pathSegments.pop(); // Remove index.html
            const cleanPath = pathSegments.join('/');
            const fullTargetUrl = `${window.location.origin}${cleanPath}/${targetGameUrl}`;

            stealthTab.document.open();
            stealthTab.document.write(`
                <html>
                <head>
                    <title>about:blank</title>
                    <style>body,html{margin:0;padding:0;overflow:hidden;background:#000;}</style>
                </head>
                <body>
                    <iframe src="${fullTargetUrl}" style="width:100vw;height:100vh;border:none;margin:0;padding:0;position:fixed;top:0;left:0;"></iframe>
                </body>
                </html>
            `);
            stealthTab.document.close();
        }
    </script>
</body>
</html>
