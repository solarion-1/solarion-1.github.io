<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solarion Offline Arcade</title>
    <style>
        body { background: #121212; color: #fff; font-family: system-ui, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .brand-header { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 20px; }
        .site-logo { max-width: 150px; height: auto; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #ffcc00; text-shadow: 2px 2px #000; margin: 0; }
        .sub { color: #aaa; font-size: 13px; margin-bottom: 25px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; max-width: 900px; margin: 0 auto; }
        .game-card { background: #1c1c1c; border: 2px solid #333; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; transition: 0.2s; }
        .game-card:hover { border-color: #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.1); }
        .game-title { font-weight: bold; margin-bottom: 10px; color: #fff; }
        .play-btn { width: 100%; padding: 10px; background: #00ffcc; color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .play-btn:hover { background: #00cc99; }
        
        /* Direct Page Display Frame Container */
        #display-viewport { width: 640px; height: 480px; max-width: 100%; margin: 30px auto; background: #000; border: 4px solid #333; border-radius: 6px; box-shadow: 0px 10px 20px rgba(0,0,0,0.5); display: none; }
        #game-frame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="brand-header">
        <img src="Designer.png" alt="Solarion Logo" class="site-logo" onerror="this.style.display='none'">
        <h1>Solarion Arcade Cloud Vault</h1>
    </div>
    <p class="sub">Select a game to boot the emulator engine directly inside the page window below.</p>
    
    <div class="grid-container">
        <div class="game-card">
            <div class="game-title">Pokémon Emerald (GBA)</div>
            <button class="play-btn" onclick="bootGameDirectly('vault/pokemon_emerald.html')">Launch Game</button>
        </div>
        <div class="game-card">
            <div class="game-title">Super Mario Advance 1 (GBA)</div>
            <button class="play-btn" onclick="bootGameDirectly('vault/super_mario_advance.html')">Launch Game</button>
        </div>
        <div class="game-card">
            <div class="game-title">Super Smash Bros 64 (N64)</div>
            <button class="play-btn" onclick="playInSameTab('vault/super_smash_bros_64.html')">Launch Game</button>
        </div>
    </div>

    <!-- The Display Area Where Games Load Instantly -->
    <div id="display-viewport">
        <iframe id="game-frame" src="" allow="autoplay"></iframe>
    </div>
    
    <script>
        // Option A: Embeds the game layout smoothly right under your buttons
        function bootGameDirectly(targetGameUrl) {
            const viewport = document.getElementById('display-viewport');
            const frame = document.getElementById('game-frame');
            
            frame.src = targetGameUrl;
            viewport.style.display = 'block';
            viewport.scrollIntoView({ behavior: 'smooth' });
        }

        // Option B: For heavy N64 files, this forces the tab to rewrite itself to avoid lag
        function playInSameTab(targetGameUrl) {
            window.location.href = targetGameUrl;
        }
    </script>
</body>
</html>
