<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solarion Console Engine</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000000; 
        }
        #game { 
            width: 100%; 
            height: 100vh; 
        }
    </style>
</head>
<body>

    <div id="game"></div>

    <script type="text/javascript">
        // 1. Detect which game button was clicked on your homepage menu
        const urlParams = new URLSearchParams(window.location.search);
        const gameName = urlParams.get('game') || 'emerald';
        const gameCore = urlParams.get('core') || 'gba';

        // 2. UNBLOCKED LINKS (Hosted on GitHub's school-safe raw network)
        const romLinks = {
            'emerald': 'https://raw.githubusercontent.com/solarion-1/solarion-1.github.io/refs/heads/main/Pokemon%20-%20Emerald%20Version%20(USA%2C%20Europe).gba',
            'black': '',
            'kirby': '',
            'starfox64': '',
            'smash64': '',
            'nsmb': '',
            'marioadvance1': 'https://raw.githubusercontent.com/solarion-1/solarion-1.github.io/refs/heads/main/Super%20Mario%20Advance%20(USA%2C%20Europe).gba',
            'marioland': ''
        };

        // 3. Fire up the EmulatorJS engine
        EJS_pathtodata = 'https://jsdelivr.net'; 
        EJS_core = gameCore; 
        EJS_gameUrl = romLinks[gameName]; 
        EJS_player = '#game'; 
    </script>
    
    <script src="https://jsdelivr.netloader.js"></script>

</body>
</html>
