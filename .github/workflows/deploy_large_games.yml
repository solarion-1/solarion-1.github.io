name: Deploy Large Game Files Override
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bypass-limit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository Base
        uses: actions/checkout@v4
        with:
          # Authenticates the checkout layer using your personal secure credentials
          token: ${{ secrets.ARCADE_PUSH_KEY }}

      - name: Inject Heavy Game Engine Binary Data
        run: |
          mkdir -p vault
          curl -L -o vault/kirby_ultra.html "https://github.com"

      - name: Push Directly to Deployment Node
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add vault/kirby_ultra.html
          git commit -m "Automated authenticated injection bypass processing for heavy files" --allow-empty
          
          # Forces the token pipeline to clear your live server cache layers
          git push origin main
