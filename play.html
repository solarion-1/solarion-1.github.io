<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test Core Load</title>
<style>
body{
    background:black;
    color:white;
    font-family:Arial;
}
</style>
</head>
<body>

<h1>Core Test</h1>

<script>
fetch("./data/cores/")
.then(r => {
    document.body.innerHTML += "<p>cores folder request: " + r.status + "</p>";
})
.catch(e => {
    document.body.innerHTML += "<p>cores folder ERROR</p>";
});

fetch("./data/loader.js")
.then(r => {
    document.body.innerHTML += "<p>loader.js: " + r.status + "</p>";
})
.catch(e => {
    document.body.innerHTML += "<p>loader.js ERROR</p>";
});

fetch("./data/version.json")
.then(r => {
    document.body.innerHTML += "<p>version.json: " + r.status + "</p>";
})
.catch(e => {
    document.body.innerHTML += "<p>version.json ERROR</p>";
});
</script>

</body>
</html>
