<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Solarion Emulator</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
}

#game {
    width: 100%;
    height: 100%;
}
</style>
</head>
<body>

<div id="game"></div>

<script>
const params = new URLSearchParams(window.location.search);
const rom = params.get("rom");

EJS_player = "#game";
EJS_color = "#000000";
EJS_startOnLoaded = true;

if (rom.endsWith(".gba")) {
    EJS_core = "gba";
}
else if (
    rom.endsWith(".z64") ||
    rom.endsWith(".n64") ||
    rom.endsWith(".v64")
) {
    EJS_core = "n64";
}

EJS_gameUrl = rom;

/* Same CDN family that worked on the school Chromebook */
EJS_pathtodata =
"https://cdn.jsdelivr.net/gh/bubblfan/emu@master/";
</script>

<script src="https://cdn.jsdelivr.net/gh/bubblfan/emu@master/loader.js"></script>

</body>
</html>
