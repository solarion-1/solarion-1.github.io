<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Solarion Emulator</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
}

#game {
    width: 100%;
    height: 100%;
}
</style>
</head>
<body>

<div id="game"></div>

<script>
const params = new URLSearchParams(window.location.search);
const rom = params.get("rom");

if (!rom) {
    document.body.innerHTML =
        "<h1 style='color:white'>No ROM specified.</h1>";
    throw new Error("No ROM specified");
}

EJS_player = "#game";
EJS_color = "#000000";
EJS_startOnLoaded = true;
EJS_gameUrl = rom;

if (rom.toLowerCase().endsWith(".gba")) {
    EJS_core = "gba";
}
else if (
    rom.toLowerCase().endsWith(".z64") ||
    rom.toLowerCase().endsWith(".n64") ||
    rom.toLowerCase().endsWith(".v64")
) {
    EJS_core = "n64";
}
else {
    document.body.innerHTML =
        "<h1 style='color:white'>Unsupported ROM type</h1>";
    throw new Error("Unsupported ROM type");
}

EJS_pathtodata =
"https://cdn.jsdelivr.net/gh/bubblfan/emu@master/";
</script>

<script src="https://gba.nicholas-vancise.dev/"></script>

</body>
</html>
