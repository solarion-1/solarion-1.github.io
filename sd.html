<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Solarion Defense</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
}
</style>

</head>
<body>

<script>

const config = {

    type: Phaser.AUTO,

    width: 800,

    height: 600,

    scene: {

        create() {

            this.add.text(
                200,
                250,
                "SOLARION DEFENSE",
                {
                    fontSize: "40px",
                    color: "#ffffff"
                }
            );

        }

    }

};

new Phaser.Game(config);

</script>

</body>
</html>
