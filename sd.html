<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Solarion Defense</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

<style>
body{
    margin:0;
    overflow:hidden;
}
</style>

</head>
<body>

<script>

class MainScene extends Phaser.Scene {

    create() {

        // green background
        this.cameras.main.setBackgroundColor("#4b8f4b");

        // shop panel
        this.add.rectangle(
            1140,
            360,
            280,
            720,
            0x222222
        );

        // title
        this.add.text(
            1020,
            20,
            "SOLARION DEFENSE",
            {
                fontSize: "24px",
                color: "#ffffff"
            }
        );

        // path
        const g = this.add.graphics();

        g.lineStyle(
            40,
            0xd4af37,
            1
        );

        g.beginPath();

        g.moveTo(0,350);
        g.lineTo(300,350);
        g.lineTo(300,150);
        g.lineTo(850,150);
        g.lineTo(850,550);
        g.lineTo(1000,550);

        g.strokePath();

    }

}

const config = {

    type: Phaser.AUTO,

    width: 1280,

    height: 720,

    scene: MainScene

};

new Phaser.Game(config);

</script>

</body>
</html>
