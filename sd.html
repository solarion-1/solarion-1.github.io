<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Solarion Defense</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

<style>
body{
    margin:0;
    overflow:hidden;
}
</style>

</head>
<body>

<script>

class MainScene extends Phaser.Scene {

    create() {

        this.cameras.main.setBackgroundColor("#4b8f4b");

        // sidebar
        this.add.rectangle(
            1140,
            360,
            280,
            720,
            0x222222
        );

        // path
        const g = this.add.graphics();

        g.lineStyle(
            40,
            0xd4af37,
            1
        );

        g.beginPath();

        g.moveTo(0,350);
        g.lineTo(250,350);
        g.lineTo(250,120);
        g.lineTo(800,120);
        g.lineTo(800,580);
        g.lineTo(1000,580);

        g.strokePath();

        // enemy test
        this.enemy =
            this.add.circle(
                100,
                100,
                15,
                0xff0000
            );

    }

    update() {

        this.enemy.x += 1;

        if(this.enemy.x > 900){
            this.enemy.x = 100;
        }

    }

}

const config = {
    type: Phaser.AUTO,
    width: 1280,
    height: 720,
    scene: MainScene
};

new Phaser.Game(config);

</script>

</body>
</html>
