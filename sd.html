<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Solarion Defense</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>
<body>
    <script>
        class MainScene extends Phaser.Scene {
            constructor() {
                super({ key: 'MainScene' });
                this.wave = 1;
                this.lives = 100;
                this.money = 650;
                this.enemies = [];
            }

            create() {
                this.cameras.main.setBackgroundColor("#4b8f4b");

                this.pathPoints = [
                    { x: 0, y: 350 },
                    { x: 250, y: 350 },
                    { x: 250, y: 120 },
                    { x: 800, y: 120 },
                    { x: 800, y: 580 },
                    { x: 1000, y: 580 }
                ];

                this.drawTrack();

                // Shop panel background
                this.add.rectangle(1140, 360, 280, 720, 0x222222);

                // Shop panel title (adjusted X position to fit nicely inside the 1000-1280 panel)
                this.add.text(1070, 30, "SOLARION\nDEFENSE", {
                    fontSize: "24px",
                    color: "#ffffff",
                    align: "center"
                });
            }

            drawTrack() {
                const graphics = this.add.graphics();
                graphics.lineStyle(40, 0x8b5a2b, 1);
                graphics.beginPath();
                graphics.moveTo(this.pathPoints[0].x, this.pathPoints[0].y);
                for (let i = 1; i < this.pathPoints.length; i++) {
                    graphics.lineTo(this.pathPoints[i].x, this.pathPoints[i].y);
                }
                graphics.strokePath();
            }
        }

        const config = {
            type: Phaser.AUTO,
            width: 1280,
            height: 720,
            scene: MainScene
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
